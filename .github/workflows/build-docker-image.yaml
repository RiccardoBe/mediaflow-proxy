name: Build & Push Docker image

on:
  # Avvio manuale dal tab "Actions"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag immagine (es. v1.2.3). Lascia vuoto per usare lo SHA."
        required: false
        default: ""
  # Build/push automatico su tag
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write   # necessario per pubblicare su GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}   # es: ghcr.io/org/repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Login al registry (GHCR) ----
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Metadati/tag automatici: latest, version, sha
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Aggiungi/porta via arch in base alle tue esigenze
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # opzionale: build-arg per versionare l'app
          build-args: |
            APP_VERSION=${{ github.event.inputs.tag || github.ref_name || github.sha }}
